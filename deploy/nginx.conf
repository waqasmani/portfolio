# Nginx reverse proxy for the portfolio app (Next.js on 127.0.0.1:3000).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: use certbot (`certbot --nginx -d example.com`) or terminate at
# Cloudflare with an origin certificate.

upstream portfolio_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # --- hardening ---------------------------------------------------------
    server_tokens off;
    client_max_body_size 6m;          # attachment uploads are capped at 5 MB

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # --- Server-Sent Events (live chat) ------------------------------------
    # Buffering would batch or swallow events; these streams must pass through.
    location ~ ^/api/(chat/stream|admin/chat/stream) {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # --- hashed build assets: cache hard ------------------------------------
    location /_next/static/ {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- everything else ----------------------------------------------------
    location / {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
